<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="https://images.unsplash.com/photo-1544005313-94ddf0286df2?q=80&w=192&auto=format&fit=crop">
  <link rel="manifest" href="manifest.json">
  <title>Aesthetic OS</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- 底层背景与毛玻璃遮罩 -->
  <div id="layer-bg"></div>
  <div id="layer-overlay"></div>

  <!-- 桌面视图 -->
  <main id="view-desktop" class="view active">
    
    <!-- 桌面网格系统 (自由拼贴排版) -->
    <div id="desktop-grid">
      
      <!-- 大时间 Widget -->
      <div class="widget-time">
        <div class="time-large">00:00</div>
        <div class="date-sub">2026.09.15 TUE</div>
      </div>

      <!-- 个人资料 Widget -->
      <div class="glass-panel widget-profile">
        <img class="profile-avatar" src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?q=80&w=200&auto=format&fit=crop" alt="avatar">
        <div class="profile-info">
          <div class="profile-name">Ishii Rei</div>
          <div class="profile-sign">Pain is a transparent gradient</div>
        </div>
      </div>

      <!-- 文字修饰 Widget -->
      <div class="widget-text" style="grid-column: span 2;">+ Our exclusive memories +</div>
      <div class="widget-text" style="grid-column: span 2;">Have a nice day</div>

      <!-- App 图标区 (10 个) -->
      <div class="app-icon-wrapper" data-app="store">
        <div class="app-icon"><svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm2 2h12v12H6zm3 3v6h6v-6H9z"/></svg></div>
        <div class="app-name">商店</div>
      </div>
      <div class="app-icon-wrapper" data-app="xianyu">
        <div class="app-icon"><svg viewBox="0 0 24 24"><path d="M12 21c-4.97 0-9-4.03-9-9s4.03-9 9-9 9 4.03 9 9-4.03 9-9 9zm0-16.5c-4.14 0-7.5 3.36-7.5 7.5s3.36 7.5 7.5 7.5 7.5-3.36 7.5-7.5-3.36-7.5-7.5-7.5zm-2 11l-3-3 1.06-1.06L10 13.38l4.94-4.94L16 9.5l-6 6z"/></svg></div>
        <div class="app-name">咸鱼</div>
      </div>
      <div class="app-icon-wrapper" data-app="meituan">
        <div class="app-icon"><svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg></div>
        <div class="app-name">美团</div>
      </div>
      <div class="app-icon-wrapper" data-app="worldbook">
        <div class="app-icon"><svg viewBox="0 0 24 24"><path d="M21 5c-1.11-.35-2.33-.5-3.5-.5-1.95 0-4.05.4-5.5 1.5-1.45-1.1-3.55-1.5-5.5-1.5S2.45 4.9 1 6v14.65c0 .25.25.5.5.5.1 0 .15-.05.25-.05C3.1 20.45 5.05 20 6.5 20c1.95 0 4.05.4 5.5 1.5 1.35-.85 3.8-1.5 5.5-1.5 1.65 0 3.35.3 4.75 1.05.1.05.15.05.25.05.25 0 .5-.25.5-.5V6c-.6-.45-1.25-.75-2-1zM12 18.5c-1.1-.7-2.9-1-5.5-1-1.4 0-2.9.2-4.1.6V7.2c1.2-.4 2.7-.7 4.1-.7 2.6 0 4.4.3 5.5 1v11z"/></svg></div>
        <div class="app-name">世界书</div>
      </div>

      <!-- 音乐 Widget -->
      <div class="glass-panel widget-music">
        <div class="music-cover"></div>
        <div class="music-info">
          <div class="music-title">Every single day counts</div>
          <div class="music-artist">Playlist · Miffy</div>
          <div class="music-progress"></div>
        </div>
      </div>

      <div class="app-icon-wrapper" data-app="music">
        <div class="app-icon"><svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg></div>
        <div class="app-name">音乐</div>
      </div>
      <div class="app-icon-wrapper" data-app="x">
        <div class="app-icon"><svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg></div>
        <div class="app-name">X</div>
      </div>
      <div class="app-icon-wrapper" data-app="instagram">
        <div class="app-icon"><svg viewBox="0 0 24 24"><path d="M7.8 2h8.4C19.4 2 22 4.6 22 7.8v8.4a5.8 5.8 0 0 1-5.8 5.8H7.8C4.6 22 2 19.4 2 16.2V7.8A5.8 5.8 0 0 1 7.8 2zm-.2 2A3.6 3.6 0 0 0 4 7.6v8.8C4 18.4 5.6 20 7.6 20h8.8a3.6 3.6 0 0 0 3.6-3.6V7.6C20 5.6 18.4 4 16.4 4H7.6zm9.65 1.5a1.25 1.25 0 0 1 0 2.5 1.25 1.25 0 0 1 0-2.5zM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg></div>
        <div class="app-name">Instagram</div>
      </div>
      <div class="app-icon-wrapper" data-app="memory">
        <div class="app-icon"><svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg></div>
        <div class="app-name">记忆总结</div>
      </div>
      <div class="app-icon-wrapper" data-app="archive">
        <div class="app-icon"><svg viewBox="0 0 24 24"><path d="M20.54 5.23l-1.39-1.68C18.88 3.21 18.47 3 18 3H6c-.47 0-.88.21-1.16.55L3.46 5.23C3.17 5.57 3 6.02 3 6.5V19c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6.5c0-.48-.17-.93-.46-1.27zM6.24 5h11.52l.83 1H5.42l.82-1zM5 19V8h14v11H5zm6-5.5l-3-3h2V9h2v1.5h2l-3 3z"/></svg></div>
        <div class="app-name">存档</div>
      </div>
      <div class="app-icon-wrapper" data-app="character">
        <div class="app-icon"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></div>
        <div class="app-name">角色</div>
      </div>
    </div>

    <!-- 底部功能区 -->
    <div id="search-pill"><span>⌕</span> 搜索</div>
    
    <!-- Dock 栏 (4 个核心应用) -->
    <div id="dock-container" class="glass-panel">
      <div class="app-icon-wrapper" data-app="phone">
        <div class="app-icon"><svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg></div>
      </div>
      <div class="app-icon-wrapper" data-app="sms">
        <div class="app-icon"><svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.17L4 17.17V4h16v12z"/></svg></div>
      </div>
      <div class="app-icon-wrapper" data-app="wechat">
        <div class="app-icon"><svg viewBox="0 0 24 24"><path d="M8.5 13c-2.48 0-4.5-1.79-4.5-4s2.02-4 4.5-4 4.5 1.79 4.5 4-2.02 4-4.5 4zM20 16c0-2.21-2.02-4-4.5-4S11 13.79 11 16s2.02 4 4.5 4c.68 0 1.32-.15 1.9-.41L20 21l-1.32-2.14c.83-.81 1.32-1.92 1.32-3.11z"/></svg></div>
      </div>
      <div class="app-icon-wrapper" data-app="settings">
        <div class="app-icon"><svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.73 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .43-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.49-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg></div>
      </div>
    </div>
  </main>

  <!-- 全局 App 运行容器 (SPA切换目标) -->
  <section id="view-app" class="view hidden">
    <header class="app-header">
      <button id="btn-home">〈 桌面</button>
      <h2 id="app-title">加载中</h2>
      <div style="width: 60px;"></div> <!-- 占位保持标题居中 -->
    </header>
    <div id="app-content">
      <!-- JS 会把具体的业务代码注入到这里 -->
    </div>
  </section>

  <script src="js/app.js"></script>
</body>
</html>
